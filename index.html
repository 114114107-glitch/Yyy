<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學系首頁</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #f8f9fa;
    }

    /* 導覽列 */
    nav {
      background-color: #1a252f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo {
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }
    nav a {
      color: #ecf0f1;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav a:hover, nav a.active {
      color: #3498db;
    }

    /* 首頁 1:5 寬幅橫幅 (G001) */
    .hero-banner {
      width: 100%;
      overflow: hidden;
    }
    .hero-banner img {
      width: 100%;
      aspect-ratio: 5 / 1; /* 1:5 寬高比例 */
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* 頁尾 */
    footer {
      background-color: #1a252f;
      color: #888;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <!-- 導覽列 -->
  <nav>
    <div class="logo">學系名稱</div>
    <ul>
      <li><a href="index.html" class="active">首頁</a></li>
      <li><a href="works.html">學生作品</a></li>
    </ul>
  </nav>

  <!-- 首頁橫幅 (G001.jpg) -->
  <header class="hero-banner">
    <img src="G001.jpg" alt="G001">
  </header>

  <footer>
    <p>&copy; 2026 學系名稱 All Rights Reserved.</p>
  </footer>

</body>
</html>
